<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 190" role="img" aria-label="Staircase training: each action block is noised to a fixed level tau=(k+1)/K, matching the levels used by rolling inference." font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif"><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fdecec"/><line x1="0" y1="0" x2="0" y2="6" stroke="#d64545" stroke-width="2" opacity=".55"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#646b78"/></marker></defs><text x="46.0" y="20" font-size="12" fill="#c2410c" text-anchor="middle" font-weight="700">τ=0.2</text><path d="M16 34 V28 H76 V34" stroke="#c2410c" stroke-width="1.4" fill="none"/><rect x="14" y="40" width="64" height="34" rx="6" fill="hsl(220 6% 80%)" stroke="#8b919c"/><text x="46.0" y="62" font-size="13" fill="#16181d" text-anchor="middle" font-weight="700" font-style="italic">B<tspan font-size="9" dy="3">0</tspan></text><text x="46.0" y="92" font-size="11" fill="#646b78" text-anchor="middle" font-weight="400">S actions</text><text x="116.0" y="20" font-size="12" fill="#c2410c" text-anchor="middle" font-weight="700">τ=0.4</text><path d="M86 34 V28 H146 V34" stroke="#c2410c" stroke-width="1.4" fill="none"/><rect x="84" y="40" width="64" height="34" rx="6" fill="hsl(220 6% 67%)" stroke="#8b919c"/><text x="116.0" y="62" font-size="13" fill="#16181d" text-anchor="middle" font-weight="700" font-style="italic">B<tspan font-size="9" dy="3">1</tspan></text><text x="116.0" y="92" font-size="11" fill="#646b78" text-anchor="middle" font-weight="400">S actions</text><text x="186.0" y="20" font-size="12" fill="#c2410c" text-anchor="middle" font-weight="700">τ=0.6</text><path d="M156 34 V28 H216 V34" stroke="#c2410c" stroke-width="1.4" fill="none"/><rect x="154" y="40" width="64" height="34" rx="6" fill="hsl(220 6% 55%)" stroke="#8b919c"/><text x="186.0" y="62" font-size="13" fill="#fff" text-anchor="middle" font-weight="700" font-style="italic">B<tspan font-size="9" dy="3">2</tspan></text><text x="186.0" y="92" font-size="11" fill="#646b78" text-anchor="middle" font-weight="400">S actions</text><text x="256.0" y="20" font-size="12" fill="#c2410c" text-anchor="middle" font-weight="700">τ=0.8</text><path d="M226 34 V28 H286 V34" stroke="#c2410c" stroke-width="1.4" fill="none"/><rect x="224" y="40" width="64" height="34" rx="6" fill="hsl(220 6% 42%)" stroke="#8b919c"/><text x="256.0" y="62" font-size="13" fill="#fff" text-anchor="middle" font-weight="700" font-style="italic">B<tspan font-size="9" dy="3">3</tspan></text><text x="256.0" y="92" font-size="11" fill="#646b78" text-anchor="middle" font-weight="400">S actions</text><text x="326.0" y="20" font-size="12" fill="#c2410c" text-anchor="middle" font-weight="700">τ=1.0</text><path d="M296 34 V28 H356 V34" stroke="#c2410c" stroke-width="1.4" fill="none"/><rect x="294" y="40" width="64" height="34" rx="6" fill="hsl(220 6% 30%)" stroke="#8b919c"/><text x="326.0" y="62" font-size="13" fill="#fff" text-anchor="middle" font-weight="700" font-style="italic">B<tspan font-size="9" dy="3">4</tspan></text><text x="326.0" y="92" font-size="11" fill="#646b78" text-anchor="middle" font-weight="400">S actions</text><text x="189.0" y="114" font-size="12" fill="#4a505c" text-anchor="middle" font-weight="400">each block gets its own fixed level; one pass supervises all K</text><line x1="14" y1="158" x2="366" y2="158" stroke="#646b78" stroke-width="1.2" marker-end="url(#arr)"/><circle cx="82.0" cy="158" r="6" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="82.0" y="178" font-size="11" fill="#646b78" text-anchor="middle" font-weight="400">0.2</text><circle cx="150.0" cy="158" r="6" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="150.0" y="178" font-size="11" fill="#646b78" text-anchor="middle" font-weight="400"