<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 190" role="img" aria-label="Action chunking: actions inside one chunk are executed open-loop, so a goal change mid-chunk is ignored until the next chunk." font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif"><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fdecec"/><line x1="0" y1="0" x2="0" y2="6" stroke="#d64545" stroke-width="2" opacity=".55"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#646b78"/></marker></defs><rect x="37" y="14" width="46" height="26" rx="6" fill="#e8f0fd" stroke="#1f5fd1"/><text x="60" y="32" font-size="14" fill="#1f5fd1" text-anchor="middle" font-weight="700" font-style="italic">o<tspan font-size="10" dy="3">t</tspan></text><rect x="437" y="14" width="46" height="26" rx="6" fill="#e8f0fd" stroke="#1f5fd1"/><text x="460" y="32" font-size="14" fill="#1f5fd1" text-anchor="middle" font-weight="700" font-style="italic">o<tspan font-size="10" dy="3">t+Hₑ</tspan></text><line x1="60" y1="42" x2="68" y2="88" stroke="#1f5fd1" stroke-width="1.6" marker-end="url(#arr)"/><text x="74" y="60" font-size="12" fill="#1f5fd1">chunk predicted from <tspan font-style="italic">o</tspan><tspan font-size="9" dy="3">t</tspan></text><rect x="62" y="92" width="36" height="28" rx="5" fill="#e9ecf1" stroke="#9aa1ad"/><rect x="102" y="92" width="36" height="28" rx="5" fill="#e9ecf1" stroke="#9aa1ad"/><rect x="142" y="92" width="36" height="28" rx="5" fill="#e9ecf1" stroke="#9aa1ad"/><rect x="182" y="92" width="36" height="28" rx="5" fill="#e9ecf1" stroke="#9aa1ad"/><rect x="222" y="92" width="36" height="28" rx="5" fill="url(#hatch)" stroke="#d64545"/><rect x="262" y="92" width="36" height="28" rx="5" fill="url(#hatch)" stroke="#d64545"/><rect x="302" y="92" width="36" height="28" rx="5" fill="url(#hatch)" stroke="#d64545"/><rect x="342" y="92" width="36" height="28" rx="5" fill="url(#hatch)" stroke="#d64545"/><rect x="382" y="92" width="36" height="28" rx="5" fill="url(#hatch)" stroke="#d64545"/><rect x="422" y="92" width="36" height="28" rx="5" fill="url(#hatch)" stroke="#d64545"/><line x1="220" y1="80" x2="220" y2="140" stroke="#d64545" stroke-width="1.6" stroke-dasharray="4 3"/><text x="226" y="86" font-size="12" fill="#d64545" text-anchor="start" font-weight="600">goal moves here</text><text x="140.0" y="138" font-size="12" fill="#646b78" text-anchor="middle">consistent with <tspan font-style="italic">o</tspan><tspan font-size="9" dy="3">t</tspan></text><text x="340.0" y="138" font-size="12" fill="#d64545" text-anchor="middle" font-weight="600">stale-context actions, still executed</text><line x1="40" y1="158" x2="500" y2="158" stroke="#646b78" stroke-width="1.2" marker-end="url(#arr)"/><text x="504" y="162" font-size="12" fill="#646b78" text-anchor="start" font-weight="400">time</text><text x="260.0" y="180" font-size="12" fill="#646b78" text-anchor="middle">all <tspan font-style="italic">H</tspan><tspan font-size="9" dy="3">e</tspan><tspan dy="-3"> actions run open-loop before the next observation is used</tspan></text></svg>